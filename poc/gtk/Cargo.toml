# Phase 3B-0A PoC: GTK4 + libadwaita window that lists devices through the
# Production library's read-only `list_candidates()`. A separate package
# (not a workspace member), so the Production CLI and library never build
# GTK. Delete this directory to remove the PoC.
[package]
name = "gtk-poc"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }
linux-usb-writer = { path = "../.." }
