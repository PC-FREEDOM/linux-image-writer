# cargo-about, the tool that generates THIRD-PARTY-LICENSES.txt, pinned to
# one upstream release. Plain KEY=VALUE lines, read as text (never sourced or
# evaluated) by the AppImage build container (build-aux/appimage/Containerfile),
# which installs it, and by generate.sh, which refuses any other binary.
#
# Never `cargo install cargo-about` (whatever version is newest that day).
# To update: choose a tagged release, download the asset, compare its SHA-256
# with the digest GitHub publishes for it, record the SHA-256 of the
# executable inside, and change every line at once. Then regenerate and
# compare THIRD-PARTY-LICENSES.txt and rust-license-manifest.txt (README.md).

CARGO_ABOUT_PROJECT=https://github.com/EmbarkStudios/cargo-about
CARGO_ABOUT_VERSION=0.9.2
# The commit tag 0.9.2 points to.
CARGO_ABOUT_COMMIT=f7394d5c8f618623573072caadf6594821c789b6
# The upstream release's own prebuilt binary (statically linked, musl).
CARGO_ABOUT_TARGET=x86_64-unknown-linux-musl
CARGO_ABOUT_URL=https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
# SHA-256 of the release archive (the same as the digest GitHub publishes).
CARGO_ABOUT_SHA256=9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
# SHA-256 of the executable in it (cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about).
CARGO_ABOUT_BINARY_SHA256=b06bd6a8bfd726cffb90e3e0588e3e0b1cfbb582bf6a34f4c1c2692ba8f2e7b8
