# cargo-about configuration for THIRD-PARTY-LICENSES.txt: the licences of the
# Rust crates the linux-image-writer GUI is built from. See README.md.
#
# Every licence accepted here was found in the dependency graph and reviewed;
# nothing is accepted "in case". A crate whose licence expression these
# entries cannot satisfy makes generation fail (cargo-about --fail), and is
# reviewed before anything is added.

# The licences under which crates may be used, in order of preference: where
# a crate offers a choice ("MIT OR Apache-2.0", "Unlicense OR MIT", ...),
# cargo-about uses the first one listed here that satisfies it. MIT is the
# only licence accepted for every crate: every crate in the graph offers it
# (alone or as one of its choices), it is compatible with the app's
# GPL-3.0-or-later, and its only condition is to carry the copyright notice
# and licence text, which THIRD-PARTY-LICENSES.txt does. Licences one crate
# needs beyond it are accepted for that crate only (below).
accepted = ["MIT"]

# The platforms the GUI is built for: the AppImage (x86_64) and the Flatpak
# (x86_64, aarch64). Crates only other platforms use are left out.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

# Build scripts' dependencies (cc, pkg-config, system-deps, ...) run on the
# build machine and are not part of the program; dev-dependencies are only
# for the tests. Procedural macros are kept: the code they generate is
# compiled into the program.
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

# ---- Crate-specific configuration (cargo-about requires it to come last) ----
#
# Each clarification names the files that are the crate's licence statement,
# with their SHA-256: cargo-about uses the clarification only if every file
# still matches, and generate.sh fails if one does not (cargo-about itself
# would only log a warning and fall back to guessing). Paths are relative to
# the crate's root.

# The app itself (the root of the graph; its LICENSE is shipped on its own,
# and THIRD-PARTY-LICENSES.txt leaves it out).
[linux-image-writer]
accepted = ["GPL-3.0-or-later"]

