# External tools used by the AppImage build, each pinned to one upstream
# release and verified by SHA-256 before use. build.sh reads this file as
# plain KEY=VALUE lines (it is never sourced or evaluated).
#
# Never point a URL at a moving release such as "continuous". To update a
# tool: choose a tagged release, download the asset, compare its SHA-256 with
# the digest GitHub publishes for it, and change every line of that tool at
# once. Then rebuild and compare the bundle manifest (README.md).
#
# The AppImage type 2 runtime is pinned on its own and handed to appimagetool
# explicitly (--runtime-file), so appimagetool never fetches one itself.

# linuxdeploy: collects the libraries the binary needs into the AppDir.
LINUXDEPLOY_PROJECT=https://github.com/linuxdeploy/linuxdeploy
LINUXDEPLOY_RELEASE=1-alpha-20251107-1
LINUXDEPLOY_COMMIT=cc7b86472c3caa3fd729b9dc502fd2aa78394257
LINUXDEPLOY_ARCH=x86_64
LINUXDEPLOY_URL=https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
LINUXDEPLOY_SHA256=c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d

# appimagetool: packs the AppDir into the AppImage (squashfs + runtime).
APPIMAGETOOL_PROJECT=https://github.com/AppImage/appimagetool
APPIMAGETOOL_RELEASE=1.9.1
APPIMAGETOOL_COMMIT=8c8c91f762b412a19f4e8d2c4b35afb98f2d7c81
APPIMAGETOOL_ARCH=x86_64
APPIMAGETOOL_URL=https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
APPIMAGETOOL_SHA256=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

# The AppImage type 2 runtime: the static (FUSE 3, no libfuse needed on the
# host) ELF program at the start of every AppImage, which mounts or extracts
# the squashfs and runs AppRun.
RUNTIME_PROJECT=https://github.com/AppImage/type2-runtime
RUNTIME_RELEASE=20251108
RUNTIME_COMMIT=dd6cebedcbddde9c82f89b011e8e1d40b6e43868
RUNTIME_ARCH=x86_64
RUNTIME_URL=https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
RUNTIME_SHA256=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
