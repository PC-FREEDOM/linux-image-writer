[package]
name = "linux-image-writer"
version = "0.1.1"
edition = "2024"
description = "A simple and safety-focused USB image writer for Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/PC-FREEDOM/linux-image-writer"

# The library (src/lib.rs) exposes only the Production API; every other
# module is private to it. The CLI binary (src/main.rs) compiles the same
# modules as its own crate, so its diagnostic modes (open-test, prepare-test,
# ...) can use internals the library never exposes -- Rust has no visibility
# that would show them to this package's binary only. The unit tests inside
# those modules therefore run once, with the binary's tests (`test = false`
# here avoids running them twice); the library's public surface is tested by
# tests/production_api.rs and the doc tests in src/lib.rs.
[lib]
path = "src/lib.rs"
test = false

# The development and diagnostic CLI (src/main.rs), named explicitly so it
# never takes the package's name: that name is the Production GUI's.
[[bin]]
name = "linux-image-writer-dev"
path = "src/main.rs"

# The Production GUI (GTK4 + libadwaita). A separate binary that uses only
# the library's public API, like any outside consumer; built only with
# `--features gui`, so the CLI and the library never need GTK.
[[bin]]
name = "linux-image-writer"
path = "src/bin/linux-image-writer/main.rs"
required-features = ["gui"]

[features]
gui = ["dep:adw", "dep:gettext-rs", "dep:gtk"]

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"], optional = true }
ctrlc = "3.5.2"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend", "runtime_detection"] }
# The GUI's translations, through the C library's own gettext.
gettext-rs = { version = "0.8.0", features = ["gettext-system"], optional = true }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"], optional = true }
libc = "0.2.189"
liblzma = { version = "0.4.8", features = ["static"] }
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["ioctl"] }
zbus = { version = "5.19.0", features = ["blocking-api"] }
