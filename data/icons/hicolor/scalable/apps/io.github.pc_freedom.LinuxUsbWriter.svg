<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="background" x1="6" y1="6" x2="122" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF27D"/>
